aid: quiz-api
name: QuizAPI
description: >-
  QuizAPI provides programmatic access to thousands of quiz questions across topics such as programming, science,
  mathematics, and general knowledge. Developers can use the API to power trivia apps, online assessments, learning
  platforms, and embedded quizzes on their own websites. Questions can be filtered by category, difficulty, and tags,
  and quizzes can be created and managed through a JSON REST API.
